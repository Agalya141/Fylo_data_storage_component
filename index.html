<!DOCTYPE html>
<html>
    <head>
        <title>Fylo Data Storage Component</title>
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
    </head>
    <body>
        <main class="component">
            <div class="fylo">
                <div class="file">
                    <div class="fylo-logo">
                        <img src="logo.svg" alt="logo" id="logo"></div>
                        <img src="icon-document.svg" alt="document" class="icon">
                        <img src="icon-folder.svg" alt="folder" class="icon">
                        <img src="icon-upload.svg" alt="upload" class="icon">
                    </div>

                <div class="left-storage"><p><span class="number2">815 </span><span class="gb2">GB LEFT</span></p>
                <div class="arrow"></div></div>
                <div class="space">
                <div class="storage">
                    <p class="text1">You've used <span class="number">815 </span><span class="gb"> GB</span> of your storage</p>
                    <div class="percentage-track">
                        <div class="percentage-fill"></div>
                    </div>

                    <p class="progress"><span class="one">0gb</span><span class="two">1000 GB</span></p>
                  
                    </div>
                </div>
            </div>

        </main>
    </body>
</html>
