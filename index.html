<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Fylo Data Storage Component</title>
        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        </head>
    <body>
        <main class="component">
            <h1 class="sr-only">Fylo Data Storage</h1>
            <div class="fylo">
                <div class="card-header">
                    <div class="fylo-logo">
                        <img src="logo.svg" alt="logo" id="logo"></div>
                        <img src="icon-document.svg" alt="document" class="icon">
                        <img src="icon-folder.svg" alt="folder" class="icon">
                        <img src="icon-upload.svg" alt="upload" class="icon">
                    </div>

                <div class="storage-remaining"><span class="remaining-value">185</span> <span class="remaining-label">GB LEFT</span>
                <div class="arrow"></div></div>
                <div class="storage-card">
                <div class="storage-details">
                    <p class="storage-text">You've used <span class="used-value">815 </span><span class="used-unit"> GB</span> of your storage</p>
                    <div class="percentage-track">
                        <div class="percentage-fill"></div>
                    </div>

                    <p class="progress-labels"><span class="progress-min">0 GB</span><span class="progress-max">1000 GB</span></p>
                  
                    </div>
                </div>
            </div>

        </main>
    </body>
</html>
